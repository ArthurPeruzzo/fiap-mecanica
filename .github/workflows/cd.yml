# CD — roda a cada push na main (ou seja, pós-merge de PR). Builda e publica a
# imagem versionada, aplica a infra (Terraform) e faz o deploy no cluster K8s.

name: CD

on:
  push:
    branches: [ "main" ]

concurrency:
  group: cd-${{ github.ref }}
  # false de propósito: este workflow muda infraestrutura real (terraform apply,
  # kubectl apply). Cancelar no meio pode deixar o Terraform state (sem lock) ou
  # o cluster num estado parcialmente aplicado. Runs concorrentes ficam na fila
  # em vez de matar um run em andamento.
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: eks-fiap-mecanica

jobs:

  dependency-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6

  docker-build-push:
    # precisa do app-infra-apply: se a infra (incluindo o ECR) tiver sido destruída
    # e recriada, o repositório só existe depois que o apply terminar — sem essa
    # dependência, o push corre risco de tentar publicar num ECR que ainda não existe.
    needs: app-infra-apply
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: producao
    permissions:
      contents: read
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Login no ECR
      uses: aws-actions/amazon-ecr-login@v2
    - name: Ler versão do pom.xml
      id: get_version
      run: echo "version=$(./mvnw -q -Dexpression=project.version -DforceStdout help:evaluate)" >> "$GITHUB_OUTPUT"
    - name: Impedir sobrescrita de uma tag já publicada
      run: |
        if aws ecr describe-images \
            --repository-name fiap-mecanica \
            --region ${{ env.AWS_REGION }} \
            --image-ids imageTag=${{ steps.get_version.outputs.version }} > /dev/null 2>&1; then
          echo "::error::Tag ${{ steps.get_version.outputs.version }} já existe no ECR. Bump a versão em pom.xml antes de dar merge na main."
          exit 1
        fi
    - name: Build da imagem
      run: docker build -t ${{ needs.app-infra-apply.outputs.ecr_repo }}:${{ steps.get_version.outputs.version }} .
    - name: Push da imagem
      run: docker push ${{ needs.app-infra-apply.outputs.ecr_repo }}:${{ steps.get_version.outputs.version }}

  # Aplica infra/terraform/app-infra (ECR + leitura, via terraform_remote_state, do db_endpoint
  # do repositório fiap-mecanica-infra-db e do eks_cluster_name do fiap-mecanica-infra-k8s).
  # Substitui o antigo módulo combinado infra/terraform/aws, que agora só gerencia o que ainda
  # não foi migrado (New Relic — ver job newrelic-legacy-apply, abaixo).
  app-infra-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: producao
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra/terraform/app-infra
    outputs:
      db_endpoint: ${{ steps.tf_outputs.outputs.db_endpoint }}
      ecr_repo: ${{ steps.tf_outputs.outputs.ecr_repo }}

    steps:
    - uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
    - name: Terraform init
      run: terraform init
    - name: Terraform apply
      run: terraform apply -auto-approve
    - name: Capturar outputs do Terraform
      id: tf_outputs
      run: |
        echo "db_endpoint=$(terraform output -raw db_endpoint)" >> "$GITHUB_OUTPUT"
        echo "ecr_repo=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"

  # Legado: o único recurso que ainda mora em infra/terraform/aws são os alertas/dashboards de
  # New Relic (migração para app-infra adiada de propósito — ver README daquele módulo). VPC/EKS
  # também têm arquivos .tf neste diretório (intocados, código idêntico ao do repositório
  # fiap-mecanica-infra-k8s, que agora é quem de fato os gerencia), porque compartilham o MESMO
  # backend key que aquele repositório usa — não há como "esvaziar" este diretório sem também
  # apagar os arquivos de VPC/EKS, o que não foi feito ainda.
  #
  # Por isso todo apply aqui usa -target, restrito EXPLICITAMENTE aos 6 recursos newrelic_*.
  # Isso é a garantia de segurança: mesmo que os arquivos de VPC/EKS aqui um dia divirjam do que
  # o repositório fiap-mecanica-infra-k8s aplicar (drift), este job JAMAIS os tocaria — o
  # -target torna estruturalmente impossível, não é uma questão de "hoje bate, então tá seguro".
  newrelic-legacy-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: producao
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra/terraform/aws
    env:
      TF_VAR_newrelic_api_key: ${{ secrets.NEW_RELIC_API_KEY }}
      TF_VAR_newrelic_account_id: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}

    steps:
    - uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
    - name: Terraform init
      run: terraform init
    - name: Terraform apply (restrito aos 6 recursos New Relic — nunca toca em VPC/EKS)
      run: |
        terraform apply -auto-approve \
          -target=newrelic_alert_policy.os_falhas \
          -target=newrelic_nrql_alert_condition.os_erros_500 \
          -target=newrelic_notification_destination.email \
          -target=newrelic_notification_channel.email \
          -target=newrelic_workflow.os_falhas \
          -target=newrelic_one_dashboard.observabilidade_negocio

  k8s-deploy:
    needs: [docker-build-push, app-infra-apply]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: producao
    permissions:
      contents: read
    outputs:
      # Hostname do ELB criado pelo Service. Consumido pelo apigw-apply, que é o único
      # ponto do pipeline onde esse valor já existe (o app-infra-apply roda antes daqui).
      lb_hostname: ${{ steps.wait_lb.outputs.hostname }}

    steps:
    - uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Apontar kubectl para o cluster EKS
      run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}
    # metrics-server e a integração Kubernetes da New Relic (Helm nri-bundle) são add-ons de
    # CLUSTER, não da aplicação — migraram para o CD do repositório fiap-mecanica-infra-k8s, que
    # roda logo após criar o EKS. Numa infra do zero, rodar aquele CD antes do primeiro deploy
    # daqui, senão o HPA fica com métricas <unknown> até o metrics-server existir (ele se
    # autocorrige assim que o add-on chegar, não é um erro permanente).
    - name: Aplicar namespace
      run: kubectl apply -f k8s/namespace.yaml
    - name: Gerar e aplicar Secret (a partir dos GitHub Secrets, sem gravar em disco)
      run: |
        kubectl create secret generic fiap-mecanica-secret -n fiap-mecanica \
          --from-literal=DB_USERNAME="${{ secrets.TF_VAR_DB_USERNAME }}" \
          --from-literal=DB_PASSWORD="${{ secrets.TF_VAR_DB_PASSWORD }}" \
          --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
          --from-literal=NEW_RELIC_LICENSE_KEY="${{ secrets.NEW_RELIC_LICENSE_KEY }}" \
          --dry-run=client -o yaml | kubectl apply -f -
    - name: Aplicar Service (antes do Deployment — só assim dá pra descobrir o hostname do LoadBalancer sem subir pods com config incompleta)
      run: kubectl apply -f k8s/service.yaml
    - name: Aguardar hostname do LoadBalancer
      id: wait_lb
      run: |
        kubectl wait --for=jsonpath='{.status.loadBalancer.ingress[0].hostname}' \
          service/fiap-mecanica -n fiap-mecanica --timeout=180s
        echo "hostname=$(kubectl get svc fiap-mecanica -n fiap-mecanica -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')" >> "$GITHUB_OUTPUT"
    - name: Gerar ConfigMap (DB_URL + URLs de orçamento já resolvidos, numa única passada)
      run: |
        kubectl create configmap fiap-mecanica-config -n fiap-mecanica \
          --from-literal=DB_URL="jdbc:mysql://${{ needs.app-infra-apply.outputs.db_endpoint }}/mecanica" \
          --from-literal=URL_APROVAR_ORCAMENTO="http://${{ steps.wait_lb.outputs.hostname }}/ordem-servico/orcamento/externo/aprovar/" \
          --from-literal=URL_RECUSAR_ORCAMENTO="http://${{ steps.wait_lb.outputs.hostname }}/ordem-servico/orcamento/externo/recusar/" \
          --dry-run=client -o yaml | kubectl apply -f -
    - name: Aplicar Deployment (pods já nascem com a config completa)
      run: kubectl apply -f k8s/deployment.yaml
    - name: Definir a versão da imagem publicada nesta run
      run: kubectl set image deployment/fiap-mecanica fiap-mecanica=${{ needs.app-infra-apply.outputs.ecr_repo }}:${{ needs.docker-build-push.outputs.version }} -n fiap-mecanica
    - name: Aplicar HPA
      run: kubectl apply -f k8s/hpa.yaml
    - name: Aguardar rollout
      run: kubectl rollout status deployment/fiap-mecanica -n fiap-mecanica --timeout=300s

  # Aplica o API Gateway (state próprio, infra/terraform/apigateway). Roda por último porque a
  # integração HTTP_PROXY precisa do hostname do ELB, que só existe depois do k8s-deploy.
  apigw-apply:
    needs: [k8s-deploy, app-infra-apply]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: producao
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra/terraform/apigateway
    env:
      TF_VAR_app_elb_host: ${{ needs.k8s-deploy.outputs.lb_hostname }}

    steps:
    - uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
    - name: Terraform init
      run: terraform init
    # A rota POST /auth/cliente só é criada se a Function Lambda já existir na conta. Ela é
    # publicada pelo CD do repositório fiap-mecanica-lambda, que é independente deste. Numa infra
    # do zero a função ainda não existe na primeira passada — sem esta checagem, o
    # `data "aws_lambda_function"` faria o apply falhar e derrubaria o deploy inteiro do app por
    # causa de um componente satélite. A próxima execução do CD cria a rota.
    - name: Habilitar a rota da Lambda somente se a função já existir
      working-directory: .
      run: |
        if aws lambda get-function --function-name fiap-mecanica-auth >/dev/null 2>&1; then
          echo "Function fiap-mecanica-auth encontrada — a rota POST /auth/cliente será criada."
          echo "TF_VAR_auth_lambda_name=fiap-mecanica-auth" >> "$GITHUB_ENV"
        else
          echo "::warning::Function fiap-mecanica-auth não existe ainda — POST /auth/cliente não será criada nesta run. Rode o CD do repositório fiap-mecanica-lambda e depois este workflow novamente."
        fi
    - name: Terraform apply
      run: terraform apply -auto-approve
    - name: Capturar a URL do gateway
      id: tf_outputs
      run: echo "api_url=$(terraform output -raw api_gateway_url)" >> "$GITHUB_OUTPUT"
    # A Lambda chama a aplicação direto no ELB (um hop a menos, e evita a chamada voltar pelo
    # gateway que a invocou). O hostname do ELB muda a cada recriação do Service, e este job é o
    # único ponto do pipeline que o conhece — por isso o repasse acontece aqui.
    - name: Repassar o endereço do ELB para a Function Lambda
      working-directory: .
      env:
        ELB_HOST: ${{ needs.k8s-deploy.outputs.lb_hostname }}
      run: |
        if ! aws lambda get-function --function-name fiap-mecanica-auth >/dev/null 2>&1; then
          echo "Function ainda não existe — nada a repassar."
          exit 0
        fi
        ATUAL=$(aws lambda get-function-configuration --function-name fiap-mecanica-auth \
          --query 'Environment.Variables.APP_BASE_URL' --output text)
        DESEJADO="http://${ELB_HOST}"
        if [ "$ATUAL" = "$DESEJADO" ]; then
          echo "APP_BASE_URL da Lambda já está correto ($ATUAL)."
          exit 0
        fi
        echo "Atualizando APP_BASE_URL da Lambda: '$ATUAL' -> '$DESEJADO'"
        # Merge com as variáveis existentes: a API substitui o mapa de environment inteiro, então
        # mandar só APP_BASE_URL apagaria JWT_SECRET e as demais.
        aws lambda get-function-configuration --function-name fiap-mecanica-auth \
          --query 'Environment.Variables' --output json > /tmp/env-atual.json
        NOVO_APP_BASE_URL="$DESEJADO" python3 - > /tmp/payload.json <<'PY'
        import json, os
        variaveis = json.load(open("/tmp/env-atual.json"))
        variaveis["APP_BASE_URL"] = os.environ["NOVO_APP_BASE_URL"]
        print(json.dumps({
            "FunctionName": "fiap-mecanica-auth",
            "Environment": {"Variables": variaveis},
        }))
        PY
        aws lambda update-function-configuration --cli-input-json file:///tmp/payload.json >/dev/null
        aws lambda wait function-updated --function-name fiap-mecanica-auth
        echo "APP_BASE_URL atualizado."
    - name: Apontar kubectl para o cluster EKS
      working-directory: .
      run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}
    # Os links de aprovação/recusa vão para o cliente final por notificação — precisam apontar
    # para o gateway, não para o ELB, senão o fluxo mais externo do sistema passa por fora dele.
    # Só dá pra fazer aqui: a URL do gateway só é conhecida depois do apply acima.
    - name: Repontar as URLs de orçamento para o gateway (e reiniciar só se algo mudou)
      working-directory: .
      env:
        API_URL: ${{ steps.tf_outputs.outputs.api_url }}
        DB_ENDPOINT: ${{ needs.app-infra-apply.outputs.db_endpoint }}
      run: |
        ATUAL_APROVAR=$(kubectl get configmap fiap-mecanica-config -n fiap-mecanica \
          -o jsonpath='{.data.URL_APROVAR_ORCAMENTO}' 2>/dev/null || echo "")
        ATUAL_BASE=$(kubectl get configmap fiap-mecanica-config -n fiap-mecanica \
          -o jsonpath='{.data.PUBLIC_BASE_URL}' 2>/dev/null || echo "")
        DESEJADO="${API_URL}/ordem-servico/orcamento/externo/aprovar/"

        kubectl create configmap fiap-mecanica-config -n fiap-mecanica \
          --from-literal=DB_URL="jdbc:mysql://${DB_ENDPOINT}/mecanica" \
          --from-literal=PUBLIC_BASE_URL="${API_URL}" \
          --from-literal=URL_APROVAR_ORCAMENTO="${DESEJADO}" \
          --from-literal=URL_RECUSAR_ORCAMENTO="${API_URL}/ordem-servico/orcamento/externo/recusar/" \
          --dry-run=client -o yaml | kubectl apply -f -

        # O ID do gateway é estável entre deploys, então a partir da segunda run os valores já
        # batem e o rollout extra é dispensado. Só o primeiro deploy (ou uma recriação do
        # gateway) paga o custo do restart.
        #
        # As DUAS chaves são comparadas de propósito: comparar só a URL de orçamento faria uma
        # chave nova (PUBLIC_BASE_URL) entrar no ConfigMap sem nunca chegar aos pods, porque a URL
        # de orçamento já estaria correta e o rollout seria pulado.
        if [ "$ATUAL_APROVAR" = "$DESEJADO" ] && [ "$ATUAL_BASE" = "$API_URL" ]; then
          echo "ConfigMap já aponta para o gateway — rollout dispensado."
        else
          echo "ConfigMap mudou (aprovar: '$ATUAL_APROVAR' -> '$DESEJADO' | base: '$ATUAL_BASE' -> '$API_URL') — reiniciando os pods."
          kubectl rollout restart deployment/fiap-mecanica -n fiap-mecanica
          kubectl rollout status deployment/fiap-mecanica -n fiap-mecanica --timeout=300s
        fi
    - name: Publicar a URL do gateway no resumo da run
      run: |
        {
          echo "### API Gateway"
          echo ""
          echo "\`${{ steps.tf_outputs.outputs.api_url }}\`"
        } >> "$GITHUB_STEP_SUMMARY"
