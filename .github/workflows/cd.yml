# CD — roda a cada push na main (ou seja, pós-merge de PR). Builda e publica a
# imagem versionada, aplica a infra (Terraform) e faz o deploy no cluster K8s.

name: CD

on:
  push:
    branches: [ "main" ]

concurrency:
  group: cd-${{ github.ref }}
  # false de propósito: este workflow muda infraestrutura real (terraform apply,
  # kubectl apply). Cancelar no meio pode deixar o Terraform state (sem lock) ou
  # o cluster num estado parcialmente aplicado. Runs concorrentes ficam na fila
  # em vez de matar um run em andamento.
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: 423972067332.dkr.ecr.us-east-1.amazonaws.com/fiap-mecanica
  EKS_CLUSTER_NAME: eks-fiap-mecanica

jobs:
  build-test:
    uses: ./.github/workflows/build-test.yml

  dependency-graph:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6

  docker-build-push:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: producao
    permissions:
      contents: read
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Login no ECR
      uses: aws-actions/amazon-ecr-login@v2
    - name: Ler versão do pom.xml
      id: get_version
      run: echo "version=$(./mvnw -q -Dexpression=project.version -DforceStdout help:evaluate)" >> "$GITHUB_OUTPUT"
    - name: Impedir sobrescrita de uma tag já publicada
      run: |
        if aws ecr describe-images \
            --repository-name fiap-mecanica \
            --region ${{ env.AWS_REGION }} \
            --image-ids imageTag=${{ steps.get_version.outputs.version }} > /dev/null 2>&1; then
          echo "::error::Tag ${{ steps.get_version.outputs.version }} já existe no ECR. Bump a versão em pom.xml antes de dar merge na main."
          exit 1
        fi
    - name: Build da imagem
      run: docker build -t ${{ env.ECR_REPOSITORY }}:${{ steps.get_version.outputs.version }} .
    - name: Push da imagem
      run: docker push ${{ env.ECR_REPOSITORY }}:${{ steps.get_version.outputs.version }}

  terraform-apply:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: producao
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra/terraform/aws
    env:
      TF_VAR_db_username: ${{ secrets.TF_VAR_DB_USERNAME }}
      TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
    outputs:
      db_endpoint: ${{ steps.tf_outputs.outputs.db_endpoint }}

    steps:
    - uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
    - name: Terraform init
      run: terraform init
    - name: Terraform apply
      run: terraform apply -auto-approve
    - name: Capturar outputs do Terraform
      id: tf_outputs
      run: echo "db_endpoint=$(terraform output -raw db_endpoint)" >> "$GITHUB_OUTPUT"

  k8s-deploy:
    needs: [docker-build-push, terraform-apply]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: producao
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Apontar kubectl para o cluster EKS
      run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}
    - name: Aplicar namespace e metrics-server
      run: |
        kubectl apply -f k8s/namespace.yaml
        kubectl apply -f k8s/metrics-server.yaml
    - name: Gerar e aplicar Secret (a partir dos GitHub Secrets, sem gravar em disco)
      run: |
        kubectl create secret generic fiap-mecanica-secret -n fiap-mecanica \
          --from-literal=DB_USERNAME="${{ secrets.TF_VAR_DB_USERNAME }}" \
          --from-literal=DB_PASSWORD="${{ secrets.TF_VAR_DB_PASSWORD }}" \
          --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
          --dry-run=client -o yaml | kubectl apply -f -
    - name: Aplicar Service (antes do Deployment — só assim dá pra descobrir o hostname do LoadBalancer sem subir pods com config incompleta)
      run: kubectl apply -f k8s/service.yaml
    - name: Aguardar hostname do LoadBalancer
      id: wait_lb
      run: |
        kubectl wait --for=jsonpath='{.status.loadBalancer.ingress[0].hostname}' \
          service/fiap-mecanica -n fiap-mecanica --timeout=180s
        echo "hostname=$(kubectl get svc fiap-mecanica -n fiap-mecanica -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')" >> "$GITHUB_OUTPUT"
    - name: Gerar ConfigMap (DB_URL + URLs de orçamento já resolvidos, numa única passada)
      run: |
        kubectl create configmap fiap-mecanica-config -n fiap-mecanica \
          --from-literal=DB_URL="jdbc:mysql://${{ needs.terraform-apply.outputs.db_endpoint }}/mecanica" \
          --from-literal=URL_APROVAR_ORCAMENTO="http://${{ steps.wait_lb.outputs.hostname }}/ordem-servico/orcamento/externo/aprovar/" \
          --from-literal=URL_RECUSAR_ORCAMENTO="http://${{ steps.wait_lb.outputs.hostname }}/ordem-servico/orcamento/externo/recusar/" \
          --dry-run=client -o yaml | kubectl apply -f -
    - name: Aplicar Deployment (pods já nascem com a config completa)
      run: kubectl apply -f k8s/deployment.yaml
    - name: Definir a versão da imagem publicada nesta run
      run: kubectl set image deployment/fiap-mecanica fiap-mecanica=${{ env.ECR_REPOSITORY }}:${{ needs.docker-build-push.outputs.version }} -n fiap-mecanica
    - name: Aplicar HPA
      run: kubectl apply -f k8s/hpa.yaml
    - name: Aguardar rollout
      run: kubectl rollout status deployment/fiap-mecanica -n fiap-mecanica --timeout=180s
