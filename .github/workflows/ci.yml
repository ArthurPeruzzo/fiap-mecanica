# CI — roda em toda pull request pra main. Valida o app (compila, testa,
# empacota) e mostra o que o Terraform mudaria (plan, sem aplicar nada). Não
# publica imagem nem faz deploy de verdade — isso é o cd.yml, pós-merge.

name: CI

on:
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1

jobs:
  build-test:
    uses: ./.github/workflows/build-test.yml

  # Um plan por root module deste repositório. Os módulos de infra K8s e de banco têm CI próprio,
  # nos respectivos repositórios (fiap-mecanica-infra-k8s, fiap-mecanica-infra-db).
  #
  # `aws` = infra/terraform/aws, que agora contém só os 6 recursos newrelic_* com state próprio
  # (tfstate/newrelic.tfstate). Entrou no matrix depois que as cópias congeladas de VPC/EKS
  # saíram dali (2026-09-08) — antes, um `plan` sem -target mostrava "a destruir" tudo que já
  # tinha migrado. Precisa dos TF_VAR_newrelic_* (vars obrigatórias); são inócuos para os outros
  # dois módulos.
  terraform-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: producao
    permissions:
      contents: read
    env:
      TF_VAR_newrelic_api_key: ${{ secrets.NEW_RELIC_API_KEY }}
      TF_VAR_newrelic_account_id: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}
    strategy:
      # Um plan por root module. `fail-fast: false` pra ver todos os resultados de uma vez em vez
      # de perder os demais quando o primeiro falha.
      fail-fast: false
      matrix:
        modulo: [app-infra, apigateway, aws]
    defaults:
      run:
        working-directory: infra/terraform/${{ matrix.modulo }}

    steps:
    - uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
    - name: Terraform init
      run: terraform init
    - name: Terraform plan
      run: terraform plan
