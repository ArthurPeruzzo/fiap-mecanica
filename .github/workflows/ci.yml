# CI — roda em toda pull request pra main. Valida o app (compila, testa,
# empacota) e mostra o que o Terraform mudaria (plan, sem aplicar nada). Não
# publica imagem nem faz deploy de verdade — isso é o cd.yml, pós-merge.

name: CI

on:
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1

jobs:
  build-test:
    uses: ./.github/workflows/build-test.yml

  terraform-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: producao
    permissions:
      contents: read
    strategy:
      # Um plan por root module. `fail-fast: false` pra ver os dois resultados de uma vez em vez
      # de perder o segundo quando o primeiro falha.
      fail-fast: false
      matrix:
        # O módulo `apigateway` não usa nenhuma das TF_VAR_* abaixo — declará-las no nível do job
        # é inofensivo, e evita duplicar o job inteiro só por causa das variáveis.
        modulo: [aws, apigateway]
    defaults:
      run:
        working-directory: infra/terraform/${{ matrix.modulo }}
    env:
      TF_VAR_db_username: ${{ secrets.TF_VAR_DB_USERNAME }}
      TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
      TF_VAR_newrelic_api_key: ${{ secrets.NEW_RELIC_API_KEY }}
      TF_VAR_newrelic_account_id: ${{ secrets.NEW_RELIC_ACCOUNT_ID }}

    steps:
    - uses: actions/checkout@v4
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
    - name: Terraform init
      run: terraform init
    - name: Terraform plan
      run: terraform plan
