name: Build & Test

on:
  workflow_call:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # o Sonar usa o historico do git (blame) para atribuir issues e detectar codigo novo
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    # `verify` roda os testes (unitários + BDD), gera o relatório do JaCoCo e APLICA o mínimo de cobertura de 80%
    # (jacoco:check). Antes o CI rodava só `test`, que não chega à fase em que o gate é aplicado.
    - name: Build, testes e cobertura mínima
      run: ./mvnw -B verify
    - name: Resumo da cobertura
      if: always()
      run: |
        if [ -f target/site/jacoco/jacoco.csv ]; then
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
        import csv
        rows = list(csv.DictReader(open("target/site/jacoco/jacoco.csv")))
        def pct(m, c):
            mm = sum(int(r[m]) for r in rows); cc = sum(int(r[c]) for r in rows)
            return f"{100*cc/(mm+cc):.1f}% ({cc}/{mm+cc})"
        print("### Cobertura de testes (JaCoCo)")
        print("")
        print("| Contador | Cobertura |")
        print("|---|---|")
        print("| Linhas | " + pct("LINE_MISSED", "LINE_COVERED") + " |")
        print("| Instruções | " + pct("INSTRUCTION_MISSED", "INSTRUCTION_COVERED") + " |")
        print("| Branches | " + pct("BRANCH_MISSED", "BRANCH_COVERED") + " |")
        print("")
        print("Mínimo exigido: 80% das linhas.")
        PY
        fi
    - name: Publicar o relatório de cobertura
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report
        path: target/site/jacoco
        if-no-files-found: ignore
    # Evidência da Fase 4: relatório do BDD (Cucumber) com os cenários, passo a passo, em HTML e JSON.
    - name: Publicar o relatório do BDD (Cucumber)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cucumber-report
        path: target/cucumber-reports
        if-no-files-found: ignore
    # Verificação de qualidade (SonarCloud). Roda sobre as classes e o relatório do JaCoCo gerados pelo `verify` acima
    # (não refaz os testes) e reprova o build se o Quality Gate falhar. Sem o secret SONAR_TOKEN (ex.: PR de fork, ou
    # SonarCloud ainda não configurado) o passo é pulado com um aviso em vez de quebrar o pipeline.
    - name: Análise de qualidade (SonarCloud)
      if: env.SONAR_TOKEN != ''
      run: ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar -Dsonar.qualitygate.wait=true
    - name: Análise de qualidade pulada (sem SONAR_TOKEN)
      if: env.SONAR_TOKEN == ''
      run: echo "::warning::SONAR_TOKEN ausente - a análise do SonarCloud foi pulada nesta execução."
    - name: Package
      run: ./mvnw -B package -DskipTests
